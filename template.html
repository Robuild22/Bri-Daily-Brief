<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bri — Daily AI Brief</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', sans-serif;
      background: #050510;
      color: #e0e8ff;
      min-height: 100vh;
      background-image:
        linear-gradient(rgba(0,212,255,0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0,212,255,0.03) 1px, transparent 1px);
      background-size: 40px 40px;
    }
    .container { max-width: 780px; margin: 0 auto; padding: 3rem 1.5rem 4rem; }
    .header { text-align: center; margin-bottom: 2.5rem; }
    .logo {
      font-family: 'Orbitron', monospace;
      font-size: 3.5rem;
      font-weight: 900;
      background: linear-gradient(135deg, #00d4ff, #a855f7);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      letter-spacing: 0.12em;
    }
    .tagline {
      font-family: 'Orbitron', monospace;
      font-size: 0.7rem;
      letter-spacing: 0.3em;
      color: #00d4ff;
      text-transform: uppercase;
      margin-top: 0.4rem;
      opacity: 0.75;
    }
    .date { font-size: 0.9rem; color: #6b7db3; margin-top: 0.75rem; letter-spacing: 0.05em; }
    .divider {
      height: 1px;
      background: linear-gradient(90deg, transparent, #00d4ff, #a855f7, transparent);
      margin: 2rem 0;
      opacity: 0.35;
    }

    /* ============================================================
       EARTH VISUAL
       TO REPLACE WITH YOUR AVATAR VIDEO:
       1. Delete the div.earth-scene block in the HTML below
       2. Paste your video element:
            <video autoplay loop muted playsinline
                   style="width:100%;border-radius:16px;margin-bottom:2rem;">
              <source src="your-avatar.mp4" type="video/mp4">
            </video>
       3. Remove the CSS between these marker comments
    ============================================================ */
    .earth-scene {
      position: relative; height: 300px; border-radius: 16px;
      background: radial-gradient(ellipse at 50% 60%, #0a0a25 0%, #020208 100%);
      border: 1px solid rgba(0,212,255,0.15);
      display: flex; align-items: center; justify-content: center;
      overflow: hidden; margin-bottom: 2rem;
    }
    .earth-scene::before {
      content: ''; position: absolute; inset: 0;
      background-image:
        radial-gradient(1.5px 1.5px at 8% 12%, rgba(255,255,255,0.7) 0%, transparent 100%),
        radial-gradient(1px 1px at 18% 55%, rgba(255,255,255,0.5) 0%, transparent 100%),
        radial-gradient(1.5px 1.5px at 30% 20%, rgba(255,255,255,0.6) 0%, transparent 100%),
        radial-gradient(1px 1px at 45% 75%, rgba(255,255,255,0.4) 0%, transparent 100%),
        radial-gradient(1px 1px at 58% 10%, rgba(255,255,255,0.6) 0%, transparent 100%),
        radial-gradient(1.5px 1.5px at 68% 45%, rgba(255,255,255,0.5) 0%, transparent 100%),
        radial-gradient(1px 1px at 88% 25%, rgba(255,255,255,0.7) 0%, transparent 100%),
        radial-gradient(1px 1px at 5% 88%, rgba(255,255,255,0.4) 0%, transparent 100%);
    }
    .earth-container { position: relative; width: 170px; height: 170px; }
    .atmosphere {
      position: absolute; inset: -14px; border-radius: 50%;
      background: radial-gradient(circle at 38% 32%,
        transparent 48%, rgba(30,144,255,0.18) 62%,
        rgba(0,212,255,0.08) 75%, transparent 85%);
      animation: atmospherePulse 4s ease-in-out infinite;
    }
    @keyframes atmospherePulse {
      0%, 100% { opacity: 0.7; }
      50% { opacity: 1; }
    }
    .earth {
      width: 170px; height: 170px; border-radius: 50%;
      overflow: hidden; position: relative;
      box-shadow:
        inset -30px -10px 50px rgba(0,0,80,0.65),
        inset 5px 5px 20px rgba(50,100,255,0.1),
        0 0 35px rgba(0,80,255,0.25);
    }
    .earth-surface {
      position: absolute; width: 200%; height: 100%; top: 0; left: 0;
      background-color: #1565a8;
      background-image:
        radial-gradient(ellipse 28px 36px at 9% 34%, rgba(34,110,34,0.88) 0%, transparent 100%),
        radial-gradient(ellipse 12px 16px at 13% 10%, rgba(210,225,240,0.65) 0%, transparent 100%),
        radial-gradient(ellipse 18px 34px at 16% 64%, rgba(34,110,34,0.82) 0%, transparent 100%),
        radial-gradient(ellipse 18px 22px at 30% 27%, rgba(34,110,34,0.80) 0%, transparent 100%),
        radial-gradient(ellipse 22px 40px at 34% 56%, rgba(34,110,34,0.85) 0%, transparent 100%),
        radial-gradient(ellipse 55px 32px at 44% 28%, rgba(34,110,34,0.82) 0%, transparent 100%),
        radial-gradient(ellipse 14px 18px at 38% 44%, rgba(180,130,50,0.55) 0%, transparent 100%),
        radial-gradient(ellipse 18px 14px at 46% 70%, rgba(160,110,40,0.70) 0%, transparent 100%),
        radial-gradient(ellipse 70px 12px at 25% 96%, rgba(220,230,245,0.45) 0%, transparent 100%),
        radial-gradient(ellipse 28px 36px at 59% 34%, rgba(34,110,34,0.88) 0%, transparent 100%),
        radial-gradient(ellipse 12px 16px at 63% 10%, rgba(210,225,240,0.65) 0%, transparent 100%),
        radial-gradient(ellipse 18px 34px at 66% 64%, rgba(34,110,34,0.82) 0%, transparent 100%),
        radial-gradient(ellipse 18px 22px at 80% 27%, rgba(34,110,34,0.80) 0%, transparent 100%),
        radial-gradient(ellipse 22px 40px at 84% 56%, rgba(34,110,34,0.85) 0%, transparent 100%),
        radial-gradient(ellipse 55px 32px at 94% 28%, rgba(34,110,34,0.82) 0%, transparent 100%),
        radial-gradient(ellipse 14px 18px at 88% 44%, rgba(180,130,50,0.55) 0%, transparent 100%),
        radial-gradient(ellipse 18px 14px at 96% 70%, rgba(160,110,40,0.70) 0%, transparent 100%),
        radial-gradient(ellipse 70px 12px at 75% 96%, rgba(220,230,245,0.45) 0%, transparent 100%);
      animation: earthRotate 18s linear infinite;
    }
    @keyframes earthRotate {
      from { transform: translateX(0); }
      to { transform: translateX(-50%); }
    }
    .earth-shine {
      position: absolute; inset: 0; border-radius: 50%;
      background: radial-gradient(circle at 33% 28%,
        rgba(255,255,255,0.28) 0%, rgba(255,255,255,0.06) 28%, transparent 55%);
      pointer-events: none;
    }
    .mic-overlay {
      position: absolute; top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      font-size: 3rem; z-index: 10;
      animation: micGlow 2.5s ease-in-out infinite;
    }
    @keyframes micGlow {
      0%, 100% { filter: drop-shadow(0 0 14px rgba(0,212,255,0.9)) drop-shadow(0 0 5px rgba(168,85,247,0.7)); }
      50% { filter: drop-shadow(0 0 24px rgba(0,212,255,1)) drop-shadow(0 0 12px rgba(168,85,247,0.95)); }
    }
    /* ============================================================
       END EARTH VISUAL CSS
    ============================================================ */

    .player-section {
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(0,212,255,0.15);
      border-radius: 16px; padding: 1.5rem; margin-bottom: 2rem;
    }
    audio { width: 100%; margin-bottom: 1.2rem; border-radius: 8px; accent-color: #00d4ff; }
    .speed-label {
      font-family: 'Orbitron', monospace; font-size: 0.6rem;
      letter-spacing: 0.2em; color: #6b7db3;
      text-transform: uppercase; margin-bottom: 0.6rem;
    }
    .speed-controls { display: flex; gap: 0.4rem; flex-wrap: wrap; }
    .speed-btn {
      padding: 0.35rem 0.65rem;
      border: 1px solid rgba(0,212,255,0.2);
      border-radius: 6px; background: transparent;
      color: #6b7db3; cursor: pointer; font-size: 0.8rem;
      font-family: 'Inter', sans-serif; transition: all 0.2s;
    }
    .speed-btn:hover { border-color: rgba(0,212,255,0.5); color: #00d4ff; }
    .speed-btn.active {
      background: linear-gradient(135deg, rgba(0,212,255,0.15), rgba(168,85,247,0.15));
      border-color: #00d4ff; color: #00d4ff;
    }
    .transcript-section { border-top: 1px solid rgba(0,212,255,0.1); padding-top: 2rem; }
    .transcript-heading {
      font-family: 'Orbitron', monospace; font-size: 0.65rem;
      letter-spacing: 0.3em; color: #00d4ff;
      text-transform: uppercase; margin-bottom: 1.5rem; opacity: 0.7;
    }
    .transcript { white-space: pre-wrap; font-size: 1rem; line-height: 1.85; color: #c0ccee; font-weight: 300; }
  </style>
</head>
<body>
  <div class="container">

    <div class="header">
      <div class="logo">BRI</div>
      <div class="tagline">Daily AI Intelligence Brief</div>
      <div class="date">BRI_DATE_PLACEHOLDER</div>
    </div>

    <div class="divider"></div>

    <!-- AVATAR AREA: delete this block and paste your video when ready -->
    <div class="earth-scene">
      <div class="earth-container">
        <div class="atmosphere"></div>
        <div class="earth">
          <div class="earth-surface"></div>
          <div class="earth-shine"></div>
        </div>
        <div class="mic-overlay">&#127897;&#65039;</div>
      </div>
    </div>

    <div class="player-section">
      <audio id="player" controls preload="metadata">
        <source src="BRI_AUDIO_PLACEHOLDER" type="audio/mpeg" />
        Your browser does not support the audio element.
      </audio>
      <div class="speed-label">Playback Speed</div>
      <div class="speed-controls">
        <button class="speed-btn" onclick="setSpeed(0.75,this)">0.75x</button>
        <button class="speed-btn active" onclick="setSpeed(1,this)">1x</button>
        <button class="speed-btn" onclick="setSpeed(1.25,this)">1.25x</button>
        <button class="speed-btn" onclick="setSpeed(1.5,this)">1.5x</button>
        <button class="speed-btn" onclick="setSpeed(1.75,this)">1.75x</button>
        <button class="speed-btn" onclick="setSpeed(2,this)">2x</button>
        <button class="speed-btn" onclick="setSpeed(2.5,this)">2.5x</button>
        <button class="speed-btn" onclick="setSpeed(3,this)">3x</button>
        <button class="speed-btn" onclick="setSpeed(4,this)">4x</button>
        <button class="speed-btn" onclick="setSpeed(5,this)">5x</button>
      </div>
    </div>

    <div class="transcript-section">
      <div class="transcript-heading">Full Transcript</div>
      <div class="transcript">BRI_SCRIPT_PLACEHOLDER</div>
    </div>

  </div>
  <script>
    const player = document.getElementById("player");
    function setSpeed(rate, btn) {
      player.playbackRate = rate;
      document.querySelectorAll(".speed-btn").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
    }
  </script>
</body>
</html>
