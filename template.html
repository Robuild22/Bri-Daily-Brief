<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bri — Daily AI Brief</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">

    <div class="header">
      <div class="logo">BRI</div>
      <div class="tagline">Daily AI Intelligence Brief</div>
      <div class="date">BRI_DATE_PLACEHOLDER</div>
    </div>

    <div class="divider"></div>

    <!-- ============================================================
         HERO SCENE — rotating Earth, satellites, orbiting clocks.
         TO SWAP IN YOUR AVATAR VIDEO LATER: delete this entire
         <div class="hero"> block and paste your video in its place:

           <video autoplay loop muted playsinline
                  style="width:100%;border-radius:18px;margin-bottom:2rem;">
             <source src="your-avatar.mp4" type="video/mp4">
           </video>
    ============================================================ -->
    <div class="hero">
      <div class="stage">
        <canvas id="globe"></canvas>
        <div class="mic">&#127897;&#65039;</div>
      </div>
      <div class="clock-layer" id="clockLayer"></div>
    </div>

    <div class="player-section">
      <audio id="player" controls preload="metadata">
        <source src="BRI_AUDIO_PLACEHOLDER" type="audio/mpeg" />
        Your browser does not support the audio element.
      </audio>
      <div class="speed-label">Playback Speed</div>
      <div class="speed-controls">
        <button class="speed-btn" onclick="setSpeed(0.75,this)">0.75x</button>
        <button class="speed-btn active" onclick="setSpeed(1,this)">1x</button>
        <button class="speed-btn" onclick="setSpeed(1.25,this)">1.25x</button>
        <button class="speed-btn" onclick="setSpeed(1.5,this)">1.5x</button>
        <button class="speed-btn" onclick="setSpeed(1.75,this)">1.75x</button>
        <button class="speed-btn" onclick="setSpeed(2,this)">2x</button>
        <button class="speed-btn" onclick="setSpeed(2.5,this)">2.5x</button>
        <button class="speed-btn" onclick="setSpeed(3,this)">3x</button>
        <button class="speed-btn" onclick="setSpeed(4,this)">4x</button>
        <button class="speed-btn" onclick="setSpeed(5,this)">5x</button>
      </div>
    </div>

    <div class="transcript-section">
      <div class="transcript-heading">Full Transcript</div>
      <div class="transcript">BRI_SCRIPT_PLACEHOLDER</div>
    </div>

  </div>

  <script>
    var player = document.getElementById("player");
    function setSpeed(rate, btn) {
      player.playbackRate = rate;
      var all = document.querySelectorAll(".speed-btn");
      for (var i = 0; i < all.length; i++) all[i].classList.remove("active");
      btn.classList.add("active");
    }
  </script>
  <script src="app.js"></script>
</body>
</html>
